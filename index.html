<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>المتجر الإلكتروني - الرئيسية</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <!-- Google Fonts: Cairo -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Cairo', sans-serif; }
    /* Hide scrollbar for horizontal category filter */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen flex flex-col">

  <!-- Header / Navigation Bar -->
  <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md shadow-sm border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <!-- Store Brand -->
      <div class="flex items-center gap-2">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-xl shadow-md shadow-indigo-200">
          <i class="fa-solid fa-bag-shopping"></i>
        </div>
        <span class="font-extrabold text-xl tracking-tight text-gray-900">متجرنا</span>
      </div>

      <!-- Cart Button (Session-Based Counter) -->
      <a href="Checkout.html" id="cartBtn" class="relative bg-gray-100 hover:bg-gray-200 p-2.5 rounded-xl text-gray-700 transition flex items-center justify-center">
        <i class="fa-solid fa-cart-shopping text-lg"></i>
        <span id="cartCount" class="absolute -top-1.5 -right-1.5 bg-indigo-600 text-white text-xs font-bold rounded-full h-5 min-w-[20px] px-1 flex items-center justify-center shadow-sm">0</span>
      </a>
    </div>
  </header>

<!-- Main Banner Section -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 w-full">
    <div class="w-full overflow-hidden rounded-2xl sm:rounded-3xl shadow-lg border border-gray-100 bg-black">
      <img 
        src="DeglaMilk.jpg" 
        alt="Degla Milk دجلة ماركت" 
        class="w-full h-auto object-cover block"
      />
    </div>
  </section>

  <!-- Main Content Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-grow">
    
    <!-- Search & Filter Controls -->
    <div class="space-y-4 mb-8">
      
      <!-- Search Bar -->
      <div class="relative max-w-md w-full">
        <input 
          type="text" 
          id="searchInput"
          placeholder="ابحث عن صنف أو منتج..." 
          class="w-full pl-10 pr-11 py-3 bg-white rounded-2xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition shadow-sm text-sm"
        />
        <i class="fa-solid fa-magnifying-glass absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
        <button id="clearSearch" class="hidden absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Dynamic Categories Tabs -->
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1" id="categoryTabs">
        <!-- Rendered dynamically -->
        <button class="px-5 py-2 rounded-xl text-sm font-semibold bg-indigo-600 text-white shadow-sm whitespace-nowrap transition">الكل</button>
      </div>
    </div>

    <!-- Loading State -->
    <div id="loadingState" class="flex flex-col items-center justify-center py-20 text-gray-400 space-y-3">
      <i class="fa-solid fa-spinner animate-spin text-3xl text-indigo-600"></i>
      <p class="text-sm font-medium">جاري تحميل المنتجات من قاعدة البيانات...</p>
    </div>

    <!-- Empty Results State -->
    <div id="emptyState" class="hidden text-center py-16 space-y-3">
      <i class="fa-solid fa-box-open text-5xl text-gray-300"></i>
      <p class="text-gray-500 font-semibold">لا توجد منتجات مطابقة للبحث أو الفئة المحددة.</p>
    </div>

    <!-- Product Grid -->
    <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-6">
      <!-- Cards dynamically generated here -->
    </div>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-5 py-3 rounded-2xl shadow-xl text-sm font-medium flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300 z-50">
    <i class="fa-solid fa-circle-check text-green-400"></i>
    <span id="toastMsg">تمت الإضافة للسلة!</span>
  </div>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-100 py-6 text-center text-xs text-gray-400">
    <div class="max-w-7xl mx-auto px-4">
      © <span id="year"></span> جميع الحقوق محفوظة لمتجرنا.
    </div>
  </footer>

  <!-- JavaScript Logic -->
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // --- CONFIGURATION ---
    const SPREADSHEET_ID = '1nlvLjx53bJurwQXMdjmrrQ3T7gl5qu0AnS9BjI8ray8';
    const SHEET_NAME = 'Database';
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;

    // State Management
    let allProducts = [];
    let selectedCategory = 'الكل';
    let searchQuery = '';

    // Cart Management (Session-based)
    // Using sessionStorage resets cart when browser tab is closed
    let cart = JSON.parse(sessionStorage.getItem('store_cart') || '[]');

    function updateCartUI() {
      const totalQty = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.getElementById('cartCount').textContent = totalQty;
      sessionStorage.setItem('store_cart', JSON.stringify(cart));
    }

    function addToCart(product) {
      const existing = cart.find(item => item.name === product.name);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ ...product, quantity: 1 });
      }
      updateCartUI();
      showToast(`تم إضافة "${product.name}" إلى السلة`);
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = message;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2000);
    }

    // --- CSV PARSER (Handles quotes & multi-lines safely) ---
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let inQuotes = false;
      let currentVal = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') { currentVal += '"'; i++; }
          else { inQuotes = !inQuotes; }
        } else if (char === ',' && !inQuotes) {
          row.push(currentVal.trim());
          currentVal = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && nextChar === '\n') { i++; }
          row.push(currentVal.trim());
          if (row.length > 1 || row[0] !== '') lines.push(row);
          row = [];
          currentVal = '';
        } else {
          currentVal += char;
        }
      }
      if (currentVal || row.length > 0) {
        row.push(currentVal.trim());
        lines.push(row);
      }
      return lines;
    }

    // Extract image URL from formulas like =IMAGE("url") or plain text URLs
// Handles direct image URLs, =IMAGE() formulas, and Google Drive sharing links
function cleanImageUrl(raw) {
  if (!raw) return '';
  let url = raw;

  // Extract URL if wrapped in =IMAGE("...") formula or text block
  const match = raw.match(/=IMAGE\("([^"]+)"\)/i) || raw.match(/https?:\/\/[^\s"']+/i);
  if (match) url = match[1] || match[0];

  // Convert Google Drive view/share links into a direct displayable image URL
  if (url.includes('drive.google.com')) {
    // Extract file ID from /d/FILE_ID/ or id=FILE_ID
    const idMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
    if (idMatch && idMatch[1]) {
      return `https://lh3.googleusercontent.com/d/${idMatch[1]}`;
    }
  }

  return url;
}

    // --- FETCH & LOAD DATA ---
    async function fetchProducts() {
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error("Failed to fetch sheet data");
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        // Data begins at row index 1 (skipping title row)
        // Col A = Category, Col B = Name, Col C = Availability, Col D = Price, Col E = Image
        allProducts = [];
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length < 3) continue;

          const category = row[0] || 'عام';
          const name = row[1] || '';
          const availability = (row[2] || '').trim();
          const price = row[3] || '0';
          const imageRaw = row[4] || '';

          // STRICT FILTER: Only items with availability == 'متوفر'
          if (availability === 'متوفر' && name !== '') {
            allProducts.push({
              category,
              name,
              price,
              image: cleanImageUrl(imageRaw)
            });
          }
        }

        renderCategoryTabs();
        renderProducts();
        document.getElementById('loadingState').classList.add('hidden');
      } catch (error) {
        console.error(error);
        document.getElementById('loadingState').innerHTML = `
          <i class="fa-solid fa-triangle-exclamation text-3xl text-red-500 mb-2"></i>
          <p class="text-sm font-semibold text-gray-600">تعذر تحميل المنتجات. جرب التأكد من صلاحة رابط Sheet.</p>
        `;
      }
    }

    // --- RENDER CATEGORY TABS ---
    function renderCategoryTabs() {
      const categories = ['الكل', ...new Set(allProducts.map(p => p.category))];
      const tabsContainer = document.getElementById('categoryTabs');
      tabsContainer.innerHTML = '';

      categories.forEach(cat => {
        const isActive = cat === selectedCategory;
        const btn = document.createElement('button');
        btn.className = `px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all ${
          isActive 
            ? 'bg-indigo-600 text-white shadow-sm' 
            : 'bg-white text-gray-600 hover:bg-gray-100 border border-gray-200'
        }`;
        btn.textContent = cat;
        btn.onclick = () => {
          selectedCategory = cat;
          renderCategoryTabs();
          renderProducts();
        };
        tabsContainer.appendChild(btn);
      });
    }

    // --- RENDER PRODUCT CARDS ---
    function renderProducts() {
      const grid = document.getElementById('productGrid');
      const emptyState = document.getElementById('emptyState');
      grid.innerHTML = '';

      const filtered = allProducts.filter(p => {
        const matchesCategory = (selectedCategory === 'الكل' || p.category === selectedCategory);
        const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              p.category.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      } else {
        emptyState.classList.add('hidden');
      }

      filtered.forEach(product => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-md transition-all duration-200 overflow-hidden flex flex-col justify-between group";

        const placeholderImg = `https://via.placeholder.com/300x300/f3f4f6/9ca3af?text=${encodeURIComponent(product.name)}`;
        const imgSrc = product.image ? product.image : placeholderImg;

        card.innerHTML = `
          <div>
            <!-- Image Frame -->
            <div class="relative aspect-square w-full bg-gray-100 overflow-hidden">
              <img 
                src="${imgSrc}" 
                alt="${product.name}" 
                class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                onerror="this.src='${placeholderImg}'"
              />
              <span class="absolute top-2 right-2 bg-white/80 backdrop-blur-md text-gray-700 text-[10px] font-bold px-2 py-0.5 rounded-md">
                ${product.category}
              </span>
            </div>

            <!-- Content -->
            <div class="p-3 sm:p-4">
              <h3 class="font-bold text-sm sm:text-base text-gray-900 line-clamp-2 mb-1">${product.name}</h3>
              <div class="text-indigo-600 font-extrabold text-base sm:text-lg">
                ${product.price} <span class="text-xs font-normal text-gray-500">ج.م</span>
              </div>
            </div>
          </div>

          <!-- Add To Cart Action -->
          <div class="p-3 sm:p-4 pt-0">
            <button 
              class="add-btn w-full bg-indigo-50 hover:bg-indigo-600 text-indigo-600 hover:text-white py-2.5 rounded-xl font-bold text-xs sm:text-sm transition-all flex items-center justify-center gap-2"
            >
              <i class="fa-solid fa-plus text-xs"></i>
              أضف للسلة
            </button>
          </div>
        `;

        card.querySelector('.add-btn').onclick = () => addToCart(product);
        grid.appendChild(card);
      });
    }

    // --- SEARCH INPUT LISTENER ---
    const searchInput = document.getElementById('searchInput');
    const clearSearch = document.getElementById('clearSearch');

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      if (searchQuery.trim() !== '') {
        clearSearch.classList.remove('hidden');
      } else {
        clearSearch.classList.add('hidden');
      }
      renderProducts();
    });

    clearSearch.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearSearch.classList.add('hidden');
      renderProducts();
    });

    // --- INITIALIZE ON LOAD ---
    updateCartUI();
    fetchProducts();
  </script>
</body>
</html>
